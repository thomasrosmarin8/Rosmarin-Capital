<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">
  <!-- White background -->
  <circle cx="150" cy="150" r="148" fill="white"/>

  <!-- Gold double ring border -->
  <circle cx="150" cy="150" r="143" fill="none" stroke="#c9a84c" stroke-width="2.8"/>
  <circle cx="150" cy="150" r="134" fill="none" stroke="#c9a84c" stroke-width="1.4"/>

  <!-- Gold sunburst rays radiating upward -->
  <g stroke="#c9a84c" stroke-linecap="round">
    <line x1="150" y1="98"  x2="150" y2="68"  stroke-width="2.2"/>
    <line x1="165" y1="100" x2="176" y2="72"  stroke-width="2"/>
    <line x1="178" y1="108" x2="196" y2="84"  stroke-width="2"/>
    <line x1="188" y1="121" x2="210" y2="103" stroke-width="2"/>
    <line x1="192" y1="137" x2="216" y2="126" stroke-width="2"/>
    <line x1="135" y1="100" x2="124" y2="72"  stroke-width="2"/>
    <line x1="122" y1="108" x2="104" y2="84"  stroke-width="2"/>
    <line x1="112" y1="121" x2="90"  y2="103" stroke-width="2"/>
    <line x1="108" y1="137" x2="84"  y2="126" stroke-width="2"/>
    <line x1="158" y1="97"  x2="164" y2="75"  stroke-width="1.5"/>
    <line x1="172" y1="103" x2="183" y2="83"  stroke-width="1.5"/>
    <line x1="142" y1="97"  x2="136" y2="75"  stroke-width="1.5"/>
    <line x1="128" y1="103" x2="117" y2="83"  stroke-width="1.5"/>
    <line x1="184" y1="114" x2="200" y2="98"  stroke-width="1.5"/>
    <line x1="116" y1="114" x2="100" y2="98"  stroke-width="1.5"/>
  </g>

  <!-- Gold semicircular sun arc -->
  <path d="M 80,164 A 70,70 0 0,1 220,164" fill="none" stroke="#c9a84c" stroke-width="2.2"/>

  <!-- Navy mountains -->
  <polygon points="50,198 102,105 158,198" fill="#1e3a6e"/>
  <polygon points="102,105 124,150 158,198 138,198" fill="#162d57"/>
  <polygon points="116,198 158,84 204,198" fill="#1e3a6e"/>
  <polygon points="158,84 174,128 200,198 180,198" fill="#162d57"/>
  <polygon points="138,198 150,174 168,198" fill="#1a3363"/>
  <rect x="48" y="195" width="204" height="6" fill="#1e3a6e" rx="2"/>

  <!-- ROSMARIN navy bold serif -->
  <text x="150" y="230"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    fill="#1e3a6e"
    font-size="28"
    font-weight="bold"
    letter-spacing="2">ROSMARIN</text>

  <!-- gold dashes + CAPITAL in gold -->
  <line x1="62"  y1="249" x2="86"  y2="249" stroke="#c9a84c" stroke-width="1.8"/>
  <text x="150" y="253"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    fill="#c9a84c"
    font-size="15"
    font-weight="600"
    letter-spacing="4">CAPITAL</text>
  <line x1="214" y1="249" x2="238" y2="249" stroke="#c9a84c" stroke-width="1.8"/>
</svg>
